<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>인찬이의 마음 광주리 - 3D 메타버스 동화 공간</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            overflow: hidden;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #11141c;
            color: #f1f5f9;
            user-select: none;
        }
        canvas { display: block; width: 100vw; height: 100vh; }

        /* UI Overlays */
        #ui-header {
            position: absolute;
            top: 20px;
            left: 24px;
            z-index: 10;
            pointer-events: auto;
        }
        .story-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            padding: 6px 14px;
            border-radius: 9999px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            font-size: 13px;
            font-weight: 600;
            color: #fde047;
            letter-spacing: -0.2px;
            margin-bottom: 8px;
        }
        .story-title {
            font-size: 26px;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            letter-spacing: -0.5px;
        }
        .story-desc {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 4px;
        }

        /* Fairy Selection Pills */
        #fairy-pills {
            position: absolute;
            top: 20px;
            right: 24px;
            display: flex;
            gap: 8px;
            z-index: 10;
            pointer-events: auto;
            flex-wrap: wrap;
            max-width: 460px;
            justify-content: flex-end;
        }
        .fairy-pill {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #e2e8f0;
            padding: 8px 14px;
            border-radius: 9999px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .fairy-pill:hover {
            transform: translateY(-2px);
            background: rgba(30, 41, 59, 0.9);
            border-color: rgba(255, 255, 255, 0.3);
        }
        .fairy-pill.active {
            box-shadow: inset 0 0 0 1.5px #fde047, 0 4px 14px rgba(253, 224, 71, 0.25);
            color: #ffffff;
        }

        /* Emotion Modal / Dialog */
        #emotion-dialog {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.95);
            background: rgba(15, 23, 42, 0.94);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 28px 32px;
            max-width: 480px;
            width: 90%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            z-index: 30;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #emotion-dialog.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            pointer-events: auto;
        }
        .dialog-tag {
            font-size: 12px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 9999px;
            display: inline-block;
            margin-bottom: 12px;
        }
        .dialog-title {
            font-size: 22px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 10px;
        }
        .dialog-body {
            font-size: 15px;
            line-height: 1.65;
            color: #cbd5e1;
            margin-bottom: 20px;
        }
        .dialog-quote {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 14px;
            color: #fde047;
            margin-bottom: 20px;
            font-style: italic;
        }
        .dialog-btn-group {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        .btn-action {
            background: #fde047;
            color: #0f172a;
            border: none;
            padding: 9px 18px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.15s, opacity 0.15s;
        }
        .btn-action:hover { opacity: 0.9; transform: scale(1.02); }
        .btn-close {
            background: rgba(255, 255, 255, 0.1);
            color: #cbd5e1;
            border: none;
            padding: 9px 16px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }
        .btn-close:hover { background: rgba(255, 255, 255, 0.18); }

        /* Story Chapter Bottom Bar */
        #story-carousel-container {
            position: absolute;
            bottom: 24px;
            left: 24px;
            right: 24px;
            z-index: 10;
            pointer-events: auto;
        }
        .carousel-bar {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }
        .chapter-chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
            padding: 4px 0;
            flex: 1;
        }
        .chapter-chips::-webkit-scrollbar { display: none; }
        .chapter-chip {
            white-space: nowrap;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 600;
            color: #cbd5e1;
            cursor: pointer;
            transition: all 0.2s;
        }
        .chapter-chip:hover {
            background: rgba(255, 255, 255, 0.14);
            color: #ffffff;
        }
        .chapter-chip.active {
            background: #fde047;
            color: #0f172a;
            font-weight: 700;
        }
        .audio-ctrl-btn {
            background: rgba(253, 224, 71, 0.15);
            border: 1px solid rgba(253, 224, 71, 0.35);
            color: #fde047;
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            transition: background 0.2s;
        }
        .audio-ctrl-btn:hover { background: rgba(253, 224, 71, 0.25); }

        /* Scene Viewer Drawer (Side Sheet) */
        #scene-viewer {
            position: absolute;
            top: 80px;
            left: 24px;
            width: 380px;
            max-height: calc(100vh - 200px);
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 20px;
            overflow-y: auto;
            z-index: 15;
            display: none;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        #scene-viewer.show { display: block; animation: slideIn 0.25s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-15px); } to { opacity: 1; transform: translateX(0); } }
        .scene-img {
            width: 100%;
            border-radius: 12px;
            margin-bottom: 14px;
            border: 1px solid rgba(255,255,255,0.1);
            object-fit: cover;
            aspect-ratio: 9/16;
            background: #000;
        }
        .scene-title { font-size: 18px; font-weight: 800; color: #fff; margin-bottom: 8px; }
        .scene-text { font-size: 14px; line-height: 1.6; color: #cbd5e1; }
    </style>

    <!-- Three.js r160 Import Map -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
</head>
<body>
    <!-- Top Left Title -->
    <div id="ui-header">
        <div class="story-badge">따뜻한 마음 살피기 동화</div>
        <h1 class="story-title">《인찬이의 마음 손님》 3D 메타버스</h1>
        <p class="story-desc">중앙의 마음 광주리와 주변의 6종 감정 요정들을 클릭해보세요</p>
    </div>

    <!-- Top Right Emotion Filter Pills -->
    <div id="fairy-pills">
        <button class="fairy-pill" onclick="focusFairy('joy')"><span style="color:#fde047">●</span> 기쁨이 (노랑)</button>
        <button class="fairy-pill" onclick="focusFairy('sadness')"><span style="color:#60a5fa">●</span> 슬픔이 (파랑)</button>
        <button class="fairy-pill" onclick="focusFairy('anger')"><span style="color:#f87171">●</span> 화 (빨강)</button>
        <button class="fairy-pill" onclick="focusFairy('fear')"><span style="color:#c084fc">●</span> 두려움이 (보라)</button>
        <button class="fairy-pill" onclick="focusFairy('worry')"><span style="color:#6ee7b7">●</span> 걱정이 (민트)</button>
        <button class="fairy-pill" onclick="focusFairy('flutter')"><span style="color:#f472b6">●</span> 설렘이 (코랄)</button>
    </div>

    <!-- Emotion Dialog Popup -->
    <div id="emotion-dialog">
        <div class="dialog-tag" id="dialog-tag">감정 손님</div>
        <h3 class="dialog-title" id="dialog-title">기쁨이</h3>
        <p class="dialog-quote" id="dialog-quote">"인찬이가 좋아하는 일이 생겼잖아!"</p>
        <p class="dialog-body" id="dialog-body">설명 내용이 여기에 들어갑니다.</p>
        <div class="dialog-btn-group">
            <button class="btn-action" id="dialog-voice-btn" onclick="playVoice()">음성 듣기</button>
            <button class="btn-close" onclick="closeDialog()">닫기</button>
        </div>
    </div>

    <!-- Side Scene Viewer (Master illustrations) -->
    <div id="scene-viewer">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
            <span style="font-size:12px; font-weight:700; color:#fde047;">원작 마스터 삽화</span>
            <button onclick="closeSceneViewer()" style="background:none; border:none; color:#94a3b8; font-size:18px; cursor:pointer;">✕</button>
        </div>
        <img id="viewer-img" class="scene-img" src="" alt="장면" />
        <h4 id="viewer-title" class="scene-title">장면 제목</h4>
        <p id="viewer-text" class="scene-text">장면 줄거리</p>
    </div>

    <!-- Bottom Carousel / Chapter Bar -->
    <div id="story-carousel-container">
        <div class="carousel-bar">
            <div class="chapter-chips" id="chapter-chips-wrapper">
                <!-- Dynamically generated chips -->
            </div>
            <button class="audio-ctrl-btn" onclick="toggleBGM()">
                <span>오디오북 음성 재생</span>
            </button>
        </div>
    </div>

    <!-- Hidden Audio Player -->
    <audio id="audio-player"></audio>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';

        let scene, camera, renderer, composer, controls;
        let basketGroup, fairies = {}, characterBillboards = {};
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // Story Emotion Definitions
        const emotionData = {
            joy: {
                name: "첫 번째 손님, 기쁨이",
                color: "#fde047",
                hexColor: 0xfde047,
                quote: "“안녕! 나는 기쁨이야! 인찬이가 좋아하는 일이 생겼잖아!”",
                body: "기쁨이는 노란색 꼬마 요정으로, 가슴을 두근거리게 하고 빙글빙글 돌며 웃음을 줘요. 친구와 축구 약속을 잡았을 때처럼 즐거운 순간 폴짝 찾아옵니다.",
                audio: "assets/inchan/audio/seg_002_기쁨이.wav"
            },
            sadness: {
                name: "두 번째 손님, 슬픔이",
                color: "#60a5fa",
                hexColor: 0x60a5fa,
                quote: "“비가 오는 것처럼… 눈물이 나는 건 당연해.”",
                body: "슬픔이는 파란색 물방울 요정이에요. 소중한 것을 잃어버리거나 아쉬울 때 찾아오며, 억지로 쫓아내지 않고 가만히 머물도록 안아주면 서서히 가벼워집니다.",
                audio: "assets/inchan/audio/seg_008_슬픔이.wav"
            },
            anger: {
                name: "세 번째 손님, 화 (분노)",
                color: "#f87171",
                hexColor: 0xf87171,
                quote: "“마음이 붉게 달아오르고 뜨거워져!”",
                body: "화는 붉은 도깨비불처럼 뜨겁게 찾아오는 손님이에요. 내 생각대로 되지 않거나 억울할 때 찾아오며, 깊은 숨을 쉬며 '내가 화가 났구나' 알아채 주는 것이 필요해요.",
                audio: "assets/inchan/audio/seg_020_화.wav"
            },
            fear: {
                name: "네 번째 손님, 두려움이",
                color: "#c084fc",
                hexColor: 0xc084fc,
                quote: "“어두운 곳이나 처음 겪는 일은 조금 무서워…”",
                body: "두려움이는 보랏빛 요정으로, 낯설거나 알 수 없는 상황에서 우리를 조심하게 만들어 주며 위험을 미리 지켜주는 고마운 손님이에요.",
                audio: "assets/inchan/audio/seg_028_두려움이.wav"
            },
            worry: {
                name: "다섯 번째 손님, 걱정이",
                color: "#6ee7b7",
                hexColor: 0x6ee7b7,
                quote: "“혹시 실수하면 어쩌지? 생각이 꼬리를 물어요.”",
                body: "걱정이는 민트빛 솜구름 요정이에요. 생각이 많아질 때 머리 위를 둥둥 떠다니지만, 엄마와 이야기 나누며 마음 광주리를 함께 들면 작아져요.",
                audio: "assets/inchan/audio/seg_035_걱정이.wav"
            },
            flutter: {
                name: "새로운 손님, 설렘이",
                color: "#f472b6",
                hexColor: 0xf472b6,
                quote: "“내일은 또 어떤 즐거운 일이 일어날까?”",
                body: "설렘이는 코랄핑크빛 별빛 요정으로, 성장의 마지막 장(10장)에서 찾아오는 새로운 시작의 기대감이에요.",
                audio: "assets/inchan/audio/seg_042_설렘이.wav"
            }
        };

        let currentActiveAudio = null;

        init();
        loadAssets();
        loadChapters();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0e131f);
            scene.fog = new THREE.FogExp2(0x0e131f, 0.035);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 3.5, 8.5);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.15;
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 + 0.05;
            controls.minDistance = 3;
            controls.maxDistance = 18;
            controls.target.set(0, 1.2, 0);

            // Lighting Setup
            const ambientLight = new THREE.AmbientLight(0xfff6e5, 1.2);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffeedd, 2.0);
            sunLight.position.set(6, 12, 8);
            sunLight.castShadow = true;
            scene.add(sunLight);

            const warmPillar = new THREE.PointLight(0xfde047, 2.5, 12);
            warmPillar.position.set(0, 1.5, 0);
            scene.add(warmPillar);

            // Postprocessing SMAA
            composer = new EffectComposer(renderer);
            composer.addPass(new RenderPass(scene, camera));
            composer.addPass(new SMAAPass(window.innerWidth * window.devicePixelRatio, window.innerHeight * window.devicePixelRatio));

            createCozyEnvironment();
            createHeartBasket();

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('click', onCanvasClick);
        }

        // Create warm nursery/kitchen floor with checker pattern
        function createCozyEnvironment() {
            // Ground disc with soft warm tones
            const groundGeo = new THREE.CylinderGeometry(8, 8.5, 0.4, 48);
            const groundMat = new THREE.MeshStandardMaterial({
                color: 0x1e293b,
                roughness: 0.8,
                metalness: 0.1
            });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.position.y = -0.2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Soft circular carpet / Kitchen rug
            const rugGeo = new THREE.CircleGeometry(4.2, 48);
            const rugMat = new THREE.MeshStandardMaterial({
                color: 0x273549,
                roughness: 0.9,
                side: THREE.DoubleSide
            });
            const rug = new THREE.Mesh(rugGeo, rugMat);
            rug.rotation.x = -Math.PI / 2;
            rug.position.y = 0.01;
            scene.add(rug);

            // Floating warm star particles (Floating emotional stardust)
            const particleCount = 200;
            const pGeo = new THREE.BufferGeometry();
            const pPos = new Float32Array(particleCount * 3);
            for (let i = 0; i < particleCount * 3; i += 3) {
                pPos[i] = (Math.random() - 0.5) * 14;
                pPos[i + 1] = Math.random() * 6;
                pPos[i + 2] = (Math.random() - 0.5) * 14;
            }
            pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
            const pMat = new THREE.PointsMaterial({
                color: 0xfde047,
                size: 0.08,
                transparent: true,
                opacity: 0.6,
                blending: THREE.AdditiveBlending
            });
            const particles = new THREE.Points(pGeo, pMat);
            scene.add(particles);
        }

        // 3D Heart Basket (마음 광주리)
        function createHeartBasket() {
            basketGroup = new THREE.Group();
            basketGroup.name = "heart_basket";

            // Basket Bowl (Lathe Geometry for woven bowl feel)
            const points = [];
            for (let i = 0; i <= 10; i++) {
                const t = i / 10;
                points.push(new THREE.Vector2(Math.sin(t * Math.PI * 0.5) * 1.3, t * 0.8));
            }
            const bowlGeo = new THREE.LatheGeometry(points, 32);
            const bowlMat = new THREE.MeshStandardMaterial({
                color: 0xd97706,
                roughness: 0.7,
                metalness: 0.15,
                wireframe: false
            });
            const bowl = new THREE.Mesh(bowlGeo, bowlMat);
            bowl.castShadow = true;
            basketGroup.add(bowl);

            // Basket Rim (Torus)
            const rimGeo = new THREE.TorusGeometry(1.3, 0.08, 16, 48);
            const rimMat = new THREE.MeshStandardMaterial({ color: 0xb45309, roughness: 0.6 });
            const rim = new THREE.Mesh(rimGeo, rimMat);
            rim.rotation.x = Math.PI / 2;
            rim.position.y = 0.8;
            basketGroup.add(rim);

            // Basket Handle
            const handleGeo = new THREE.TorusGeometry(1.2, 0.06, 16, 48, Math.PI);
            const handle = new THREE.Mesh(handleGeo, rimMat);
            handle.position.y = 0.8;
            basketGroup.add(handle);

            // Inner Heart Glow Core
            const coreGeo = new THREE.SphereGeometry(0.5, 32, 32);
            const coreMat = new THREE.MeshStandardMaterial({
                color: 0xfffbeb,
                emissive: 0xfde047,
                emissiveIntensity: 1.2,
                roughness: 0.2
            });
            const core = new THREE.Mesh(coreGeo, coreMat);
            core.position.y = 0.45;
            basketGroup.add(core);

            basketGroup.position.set(0, 0, 0);
            scene.add(basketGroup);
        }

        // Load Inchan, Mom & Fairies
        function loadAssets() {
            const textureLoader = new THREE.TextureLoader();

            // 1. Inchan Billboard Avatar (정수리 바보털, 점눈, 볼터치 인찬이)
            textureLoader.load('assets/inchan/인찬이_기준앵커_정면전신.png', (tex) => {
                tex.colorSpace = THREE.SRGBColorSpace;
                const aspect = tex.image.width / tex.image.height;
                const height = 2.0;
                const planeGeo = new THREE.PlaneGeometry(height * aspect, height);
                const planeMat = new THREE.MeshStandardMaterial({
                    map: tex,
                    transparent: true,
                    alphaTest: 0.1,
                    roughness: 0.5
                });
                const inchanMesh = new THREE.Mesh(planeGeo, planeMat);
                inchanMesh.position.set(-1.8, 1.0, 0.8);
                inchanMesh.castShadow = true;
                inchanMesh.userData = { type: 'inchan', name: '인찬이' };
                scene.add(inchanMesh);
                characterBillboards['inchan'] = inchanMesh;
            });

            // 2. Mom Billboard Avatar (다정하고 온화한 엄마)
            textureLoader.load('assets/inchan/엄마_기준앵커_정면전신.png', (tex) => {
                tex.colorSpace = THREE.SRGBColorSpace;
                const aspect = tex.image.width / tex.image.height;
                const height = 2.6;
                const planeGeo = new THREE.PlaneGeometry(height * aspect, height);
                const planeMat = new THREE.MeshStandardMaterial({
                    map: tex,
                    transparent: true,
                    alphaTest: 0.1,
                    roughness: 0.5
                });
                const momMesh = new THREE.Mesh(planeGeo, planeMat);
                momMesh.position.set(1.8, 1.3, 0.2);
                momMesh.castShadow = true;
                momMesh.userData = { type: 'mom', name: '엄마' };
                scene.add(momMesh);
                characterBillboards['mom'] = momMesh;
            });

            // 3. Create 6 Emotion Fairies in 3D orbit around Heart Basket
            const keys = Object.keys(emotionData);
            keys.forEach((key, index) => {
                const angle = (index / keys.length) * Math.PI * 2;
                const radius = 2.4;
                const fairyGroup = new THREE.Group();

                // Fairy Core
                const fairyGeo = new THREE.SphereGeometry(0.24, 24, 24);
                const fairyMat = new THREE.MeshStandardMaterial({
                    color: emotionData[key].hexColor,
                    emissive: emotionData[key].hexColor,
                    emissiveIntensity: 0.8,
                    roughness: 0.3
                });
                const fairyCore = new THREE.Mesh(fairyGeo, fairyMat);
                fairyCore.castShadow = true;
                fairyGroup.add(fairyCore);

                // Fairy Halo Ring
                const haloGeo = new THREE.TorusGeometry(0.38, 0.025, 12, 32);
                const haloMat = new THREE.MeshBasicMaterial({
                    color: emotionData[key].hexColor,
                    transparent: true,
                    opacity: 0.75
                });
                const halo = new THREE.Mesh(haloGeo, haloMat);
                halo.rotation.x = Math.PI / 3;
                fairyGroup.add(halo);

                fairyGroup.position.set(
                    Math.cos(angle) * radius,
                    1.2 + Math.sin(index) * 0.3,
                    Math.sin(angle) * radius
                );

                fairyGroup.userData = {
                    key: key,
                    baseAngle: angle,
                    radius: radius,
                    speed: 0.008 + index * 0.0015,
                    type: 'fairy'
                };

                scene.add(fairyGroup);
                fairies[key] = fairyGroup;
            });
        }

        // Chapters & Master Scenes
        async function loadChapters() {
            try {
                const [storyRes, scenesRes] = await Promise.all([
                    fetch('assets/inchan/story_data.json'),
                    fetch('assets/inchan/scenes_data.json')
                ]);
                const chapters = await storyRes.json();
                const scenes = await scenesRes.json();

                const chipsWrapper = document.getElementById('chapter-chips-wrapper');
                chipsWrapper.innerHTML = '';

                chapters.forEach((ch, idx) => {
                    const chip = document.createElement('button');
                    chip.className = 'chapter-chip' + (idx === 0 ? ' active' : '');
                    chip.textContent = ch.title;
                    chip.onclick = () => selectChapter(ch, idx, scenes);
                    chipsWrapper.appendChild(chip);
                });
            } catch (err) {
                console.warn('Could not load chapter json:', err);
            }
        }

        function selectChapter(chapter, index, scenes) {
            document.querySelectorAll('.chapter-chip').forEach((c, i) => {
                c.classList.toggle('active', i === index);
            });

            // Find matching scenes for chapter
            const prefix = `${index + 1}장`;
            const matched = scenes.find(s => s.filename.startsWith(prefix));

            const viewer = document.getElementById('scene-viewer');
            if (matched) {
                document.getElementById('viewer-img').src = matched.path;
                document.getElementById('viewer-title').textContent = chapter.title;
                document.getElementById('viewer-text').textContent = chapter.content.substring(0, 220) + '...';
                viewer.classList.add('show');
            }

            // Smooth camera look target
            controls.target.set(0, 1.2, 0);
        }

        // Interactive Click Raycasting
        function onCanvasClick(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(scene.children, true);

            if (intersects.length > 0) {
                let obj = intersects[0].object;
                while (obj.parent && !obj.userData?.type && obj !== scene) {
                    obj = obj.parent;
                }

                if (obj.userData?.type === 'fairy') {
                    showFairyDialog(obj.userData.key);
                } else if (obj.userData?.type === 'inchan') {
                    showInchanDialog();
                } else if (obj.name === 'heart_basket') {
                    showBasketDialog();
                }
            }
        }

        function showFairyDialog(key) {
            const data = emotionData[key];
            if (!data) return;

            const dialog = document.getElementById('emotion-dialog');
            const tag = document.getElementById('dialog-tag');
            tag.textContent = "감정 손님";
            tag.style.background = data.color;
            tag.style.color = "#0f172a";

            document.getElementById('dialog-title').textContent = data.name;
            document.getElementById('dialog-quote').textContent = data.quote;
            document.getElementById('dialog-body').textContent = data.body;
            currentActiveAudio = data.audio;

            dialog.classList.add('show');
        }

        function showInchanDialog() {
            const dialog = document.getElementById('emotion-dialog');
            const tag = document.getElementById('dialog-tag');
            tag.textContent = "주인공";
            tag.style.background = "#fde047";
            tag.style.color = "#0f172a";

            document.getElementById('dialog-title').textContent = "인찬이 (3.2등신 꼬마)";
            document.getElementById('dialog-quote').textContent = "“엄마, 나한테도 마음 광주리가 있어? 어떤 손님이 온 거지?”";
            document.getElementById('dialog-body').textContent = "정수리에 삐죽 솟은 단 하나의 귀여운 바보털, 점눈과 발그레한 볼터치가 매력적인 씩씩한 아이 인찬이에요. 오늘 마음 광주리에 찾아올 손님을 호기심 가득히 기다리고 있어요.";
            currentActiveAudio = "assets/inchan/audio/seg_001_인찬이.wav";

            dialog.classList.add('show');
        }

        function showBasketDialog() {
            const dialog = document.getElementById('emotion-dialog');
            const tag = document.getElementById('dialog-tag');
            tag.textContent = "마음의 중심";
            tag.style.background = "#d97706";
            tag.style.color = "#ffffff";

            document.getElementById('dialog-title').textContent = "황금빛 마음 광주리";
            document.getElementById('dialog-quote').textContent = "“사람에게는 누구나 마음 광주리가 있어. 여러 감정들이 손님으로 찾아와 머물다 가지.”";
            document.getElementById('dialog-body').textContent = "기쁨, 슬픔, 화, 두려움, 걱정, 설렘... 모든 감정은 나쁜 것이 아니라 우리를 찾아오는 소중한 손님들이에요. 광주리를 혼자 무겁게 들지 않고 주변에 나누면 마음이 한결 가벼워집니다.";
            currentActiveAudio = "assets/inchan/audio/seg_001_인찬이.wav";

            dialog.classList.add('show');
        }

        // Global functions for window onclick
        window.focusFairy = function(key) {
            showFairyDialog(key);
            const fairy = fairies[key];
            if (fairy) {
                controls.target.copy(fairy.position);
            }
        };

        window.closeDialog = function() {
            document.getElementById('emotion-dialog').classList.remove('show');
        };

        window.closeSceneViewer = function() {
            document.getElementById('scene-viewer').classList.remove('show');
        };

        window.playVoice = function() {
            const player = document.getElementById('audio-player');
            if (currentActiveAudio) {
                player.src = currentActiveAudio;
                player.play().catch(e => console.warn('Audio play prevented:', e));
            }
        };

        window.toggleBGM = function() {
            const player = document.getElementById('audio-player');
            if (player.paused) {
                player.src = "assets/inchan/audio/seg_001_인찬이.wav";
                player.play().catch(e => console.warn('Audio play:', e));
            } else {
                player.pause();
            }
        };

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate(time) {
            requestAnimationFrame(animate);

            const t = time * 0.001;

            // Basket floating gently
            if (basketGroup) {
                basketGroup.position.y = Math.sin(t * 1.5) * 0.08;
                basketGroup.rotation.y = t * 0.2;
            }

            // Fairies revolving around basket
            Object.values(fairies).forEach((fairy, idx) => {
                const u = fairy.userData;
                const angle = u.baseAngle + t * (0.4 + idx * 0.05);
                fairy.position.x = Math.cos(angle) * u.radius;
                fairy.position.z = Math.sin(angle) * u.radius;
                fairy.position.y = 1.0 + Math.sin(t * 2 + idx) * 0.35;
                fairy.rotation.y = t * 1.2;
            });

            // Billboards look at camera
            Object.values(characterBillboards).forEach(b => {
                b.quaternion.copy(camera.quaternion);
            });

            controls.update();
            composer.render();
        }
    </script>
</body>
</html>
